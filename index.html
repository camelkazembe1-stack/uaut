<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAUT | Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("https://www.uaut.ac.tz/wp-content/uploads/2025/01/logo-Photoroom.png");
            background-repeat: no-repeat;
            background-position: center;
            background-size: min(65vw, 520px);
            opacity: 0.13;
            z-index: -1;
        }

        .google-login {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .user-profile {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 3px 15px #00000015;
            color: #123c70;
            font-weight: 600;
        }

        .user-profile img {
            width: 34px;
            height: 34px;
            border-radius: 50%;
        }

        main {
            text-align: center;
            padding: 40px 24px;
        }

        h1 {
            color: #123c70;
            font-size: clamp(2rem, 6vw, 4rem);
        }

        p {
            margin-top: 14px;
            color: #52657d;
            font-size: 1.1rem;
        }
    </style>
</head>

<body>

    <div class="google-login">
        <div id="googleButton"></div>

        <div class="user-profile" id="userProfile">
            <img id="userPicture" src="" alt="Profile">
            <span id="userName"></span>
        </div>
    </div>

    <main>
        <h1>Welcome to UAUT</h1>
        <p>United African University of Tanzania</p>
    </main>

    <script>
        // Replace this with your Google OAuth Client ID.
        const GOOGLE_CLIENT_ID = "YOUR_GOOGLE_CLIENT_ID";

        function initializeGoogle() {
            if (GOOGLE_CLIENT_ID === "YOUR_GOOGLE_CLIENT_ID") {
                document.getElementById("googleButton").innerHTML =
                    '<button style="padding:12px 20px;border:1px solid #ccc;border-radius:6px;background:white;cursor:pointer;" onclick="alert(\'Configure your Google OAuth Client ID first.\')">Sign in with Google</button>';
                return;
            }

            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleGoogleLogin
            });

            google.accounts.id.renderButton(
                document.getElementById("googleButton"),
                {
                    theme: "outline",
                    size: "large",
                    shape: "pill",
                    text: "signin_with"
                }
            );
        }

        function handleGoogleLogin(response) {
            try {
                const payload = JSON.parse(
                    atob(
                        response.credential.split(".")[1]
                            .replace(/-/g, "+")
                            .replace(/_/g, "/")
                    )
                );

                document.getElementById("userName").textContent =
                    payload.name || payload.email;

                document.getElementById("userPicture").src =
                    payload.picture || "";

                document.getElementById("googleButton").style.display = "none";
                document.getElementById("userProfile").style.display = "flex";

            } catch (error) {
                alert("Google login failed. Please try again.");
                console.error(error);
            }
        }
    </script>

    <script
        src="https://accounts.google.com/gsi/client"
        async
        defer
        onload="initializeGoogle()">
    </script>

</body>
</html>
