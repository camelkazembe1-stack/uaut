<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAUT | Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("https://www.uaut.ac.tz/wp-content/uploads/2025/01/logo-Photoroom.png");
            background-repeat: no-repeat;
            background-position: center;
            background-size: min(65vw, 520px);
            opacity: 0.13;
            z-index: -1;
        }

        main {
            text-align: center;
            padding: 40px 24px;
        }

        h1 {
            color: #123c70;
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 700;
        }

        p {
            margin-top: 14px;
            color: #52657d;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <main>
        <h1>Welcome to UAUT</h1>
        <p>United African University of Tanzania</p>
    </main>
</body>
</html>
